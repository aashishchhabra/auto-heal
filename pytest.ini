[pytest]
# Tests import as `from src.xxx import ...` (repo-root-relative, dotted),
# not as bare `import xxx` from inside src/ - the path added here must be
# the repo root, not src/ itself, or bare `pytest` (as opposed to
# `python -m pytest`, which implicitly puts the CWD on sys.path) can't
# resolve `src` as a package at all.
pythonpath = .
