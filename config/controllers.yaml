controllers:
  dc1-ansible:
    type: ansible
    host: ansible.dc1.example.com
    ssh_user: ansible
    ssh_key: /secrets/dc1_ansible.key
  dc2-ansible:
    type: ansible
    host: ansible.dc2.example.com
    ssh_user: ansible
    ssh_key: /secrets/dc2_ansible.key
  dc2-oc:
    type: oc
    host: oc.dc2.example.com
    ssh_user: ocadmin
    ssh_key: /secrets/dc2_oc.key
  ansible_local:
    type: ansible
    host: localhost
    ssh_user: root
    ssh_key: /root/.ssh/id_rsa
  local:
    type: local
  # ssh_key also accepts a Vault reference instead of a file path:
  #   ssh_key: "vault:secret/data/auto-healer/controllers/dc2-oc"
  # or, if the private key is stored under a field other than the
  # "private_key" default:
  #   ssh_key: "vault:secret/data/auto-healer/controllers/dc2-oc#ssh_private_key"
  # The key material is fetched from Vault and written to a private
  # (mode 0600) tempfile just for the duration of a single ssh call, then
  # deleted immediately after - it never touches persistent disk. See
  # src/executor.py::ActionExecutor._resolve_ssh_key.

  # type: kubeapi controllers talk to the Kubernetes/OpenShift API server
  # directly - no SSH, no oc/kubectl subprocess. See kube_action entries
  # in config/actions.yaml and src/executor.py::ActionExecutor.run_kube_action.
  #
  # In-cluster (recommended when Auto-Healer runs as a Pod inside the
  # cluster it heals): zero credential config here at all. Kubernetes
  # auto-mounts a ServiceAccount token; RBAC is controlled entirely by
  # which ServiceAccount the Deployment binds to.
  k8s-in-cluster:
    type: kubeapi
    in_cluster: true

  # Remote cluster, explicit ServiceAccount token (recommended over a
  # full kubeconfig - scope the token's RBAC Role to exactly the verbs
  # this needs, e.g. patch on deployments, delete on pods, nothing more):
  #   k8s-prod:
  #     type: kubeapi
  #     api_server: https://api.prod.example.com:6443
  #     token: "vault:secret/data/auto-healer/clusters/prod#token"
  #     ca_cert: "vault:secret/data/auto-healer/clusters/prod#ca_cert"
  #
  # Or, if you already have a scoped kubeconfig from your platform team:
  #   k8s-staging:
  #     type: kubeapi
  #     kubeconfig: "vault:secret/data/auto-healer/clusters/staging#kubeconfig"
  # token/ca_cert/kubeconfig all accept the same plain-file-path or
  # vault:<path>#<field> forms as ssh_key above.
