# Notification configuration for Auto-Healer.
#
# Every channel below is opt-in and disabled by default - a fresh clone
# sends no notifications anywhere until you turn one on. Values that look
# like secrets (passwords, API keys, routing keys) accept the same
# "vault:<path>#<field>" syntax used everywhere else in this codebase.

slack:
  enabled: false
  webhook_url: "https://hooks.slack.com/services/REPLACE_WITH_REAL_URL"
  channel: "#autoheal-notifications"
  username: "AutoHealerBot"
  notify_on: [success, failure]

teams:
  enabled: false
  webhook_url: "https://outlook.office.com/webhook/REPLACE_WITH_REAL_URL"
  notify_on: [success, failure]

# SMTP email - no third-party dependency, works with any mail relay.
email:
  enabled: false
  smtp_host: "smtp.example.com"
  smtp_port: 587
  use_tls: true
  username: "vault:secret/data/auto-healer/email#username"
  password: "vault:secret/data/auto-healer/email#password"
  from_addr: "auto-healer@example.com"
  to_addrs: ["oncall@example.com"]
  notify_on: [success, failure]

# PagerDuty Events API v2 (https://developer.pagerduty.com/docs/events-api-v2/overview/).
# Pages a human, so - unlike the channels above - the default notify_on is
# failure only; a team that also wants a page on every successful
# auto-remediation has to opt into that explicitly.
pagerduty:
  enabled: false
  routing_key: "vault:secret/data/auto-healer/pagerduty#routing_key"
  notify_on: [failure]

# Opsgenie Alert API (https://docs.opsgenie.com/docs/alert-api). Same
# reasoning as PagerDuty - defaults to failure only.
opsgenie:
  enabled: false
  api_key: "vault:secret/data/auto-healer/opsgenie#api_key"
  notify_on: [failure]

# Severity-based routing: which channels a given severity fans out to.
# Leave this whole section commented out (the default) and every enabled
# channel above gets every notification, same as before routing existed.
# An action's severity comes from its own `severity:` field in
# actions.yaml (default "info"); a failed execution is always bumped to
# at least "warning" regardless of what the action declares.
#
# routing:
#   info: [slack]
#   warning: [slack, email]
#   critical: [slack, pagerduty, opsgenie]

# Deduplication: suppresses re-sending the same (action, controller,
# status) notification within window_seconds - independent of the
# cooldowns/rate limits that already throttle the underlying webhook
# calls. On by default; a flapping action shouldn't also flood every
# notification channel just because it isn't cooling down yet.
dedup:
  enabled: true
  window_seconds: 300

# Optional custom message templates, one per channel plus an optional
# "default" fallback for channels without their own entry. A plain
# str.format() string with fields: action, controller, user, status,
# severity, details. Leave unset (the default) to keep each channel's
# existing built-in wording.
#
# templates:
#   default: "Auto-Healer: {action} on {controller} - {status} ({severity})"
#   pagerduty: "🚨 {action} failed on {controller} - see audit log for {user}'s request"
