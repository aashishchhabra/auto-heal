actions:
  restart_service:
    description: Restart a system service on a host
    playbook: playbooks/restart_service.yml
    default_controller: ansible_local
    parameters:
      service_name: "nginx"

  cleanup_disk:
    description: Clean up disk space on a host
    script: scripts/cleanup_disk.sh
    default_controller: local

  health_check:
    description: Run a health check command
    script: scripts/health_check.sh
    default_controller: local

  restart_deployment:
    description: >-
      Restart an OpenShift deployment by SSHing to the oc-configured
      controller and running `oc rollout restart`. {deployment} and
      {namespace} are substituted from parameters and shell-quoted before
      the command reaches the controller's shell.
    command: "oc rollout restart deployment/{deployment} -n {namespace}"
    default_controller: dc2-oc
    parameters:
      namespace: "default"
    # Don't restart the same deployment more than once every 5 minutes,
    # even if a flapping alert keeps re-triggering this action.
    cooldown_seconds: 300
    cooldown_key_param: deployment
